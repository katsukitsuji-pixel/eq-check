<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>機材 持出・返却チェック</title>
<!--
  HCX 機材 持出・返却チェック（現場スマホ用）

  ★★★ なぜこの画面だけ外（GitHub Pages）にあるか
    Apps Script の画面は Google の入れ子の枠（iframe）の中で動きます。
    その枠にカメラの許可が付いていないので、**カメラを開けません。**
    だから読み取りだけを外に置き、機材システムへ問い合わせます。

  ★★ 設定するのは1か所だけです（下の API_URL）。
    合言葉はここに置きません。案件ごとの使い捨てトークン（?t=）で本人を確かめます。
    このファイルが誰に見られても、**中に鍵はありません。**
-->
<script src="./html5-qrcode.min.js" onerror="window.__カメラの予備なし = 1;"></script>
<style>
  :root{ --pri:#1a73e8; --ok:#0f9d58; --warn:#d93025; --bg:#f0f2f5; --bd:#dadce0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  /* ★★★★ **1画面に収めること。**（2026-08-17 辻さんのご指示）
       「持出か返却か・案件名・倍率・直近で読んだ機材名」は、
       **指を動かさずに全部見えること。**
       現場は片手にQR、片手にスマホです。スクロールさせてはいけません。

     ★★ そのために、画面全体を**縦の箱**にして、
       **スクロールしてよいのは機材の一覧だけ**にします。
       `100dvh` は、スマホのアドレスバーが出入りしても高さが狂わない書き方です。
       効かない古い端末のために `100vh` も先に書いておきます。 */
  html,body{ height:100vh; height:100dvh; }
  body{ margin:0; font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
        background:var(--bg); color:#222;
        display:flex; flex-direction:column; overflow:hidden; }

  header{ background:#fff; border-bottom:1px solid var(--bd); padding:6px 10px 8px;
          flex:0 0 auto; }
  .modebar{ display:flex; gap:6px; }
  .modebar button{ flex:1; padding:9px 0; font-size:14px; font-weight:bold;
                   border:1px solid var(--pri); background:#fff; color:var(--pri); border-radius:6px; }
  .modebar button.on{ background:var(--pri); color:#fff; }
  /* ★ 案件名は**1行**。長くても折り返さず、はみ出しは … にする（高さを動かさないため） */
  .order{ font-size:12px; color:#333; margin-top:6px;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .order small{ color:#777; }

  .bar{ display:flex; align-items:center; gap:8px; padding:6px 10px; background:#fff;
        border-bottom:1px solid var(--bd); flex:0 0 auto; }
  .prog{ font-weight:bold; font-size:14px; white-space:nowrap; }
  .prog small{ color:#888; font-weight:normal; font-size:11px; }

  /* ★★★★ **カメラは画面の3分の1まで。**（2026-08-17 辻さんのご指示）
       前は縦いっぱいに広がり、下の欄がスクロールしないと読めませんでした。

     ★★★★ **ただし、映像そのものを縮めてはいけません。**（2026-08-17、私の失敗）
       はじめ `height:100%` と `object-fit:cover` で押し込みました。
       見た目は3分の1になりましたが、**QRに一切反応しなくなりました。**

       読み取り部品は、映像のどこを読むかを
           横の倍率 = videoWidth  ÷ 映像の見た目の幅
           縦の倍率 = videoHeight ÷ 映像の見た目の高さ
       と、**縦横それぞれ別に**計算します。
       縦だけ押しつぶすと縦横の倍率がずれ、**読む場所も、縦横比も狂います。**
       2.5倍に引き伸ばされたQRは、どうやっても読めません。

     ★ そこで、**映像は素の形のまま**にして、**外の箱で切り取ります。**
       箱（#readerBox）に高さを持たせて、はみ出したぶんを隠すだけ。
       映像の見た目の縦横比は変わらないので、倍率は縦横で同じままです。
       読み取る四角は映像の真ん中にできるので、
       **その真ん中が箱に来るように、映像を上へずらします**（`カメラを真ん中に寄せる_`）。 */
  #readerBox{ display:none; background:#000; flex:0 0 auto; height:33vh; height:33dvh;
              overflow:hidden; position:relative; }
  #reader video{ width:100% !important; }

  /* 倍率と、直近で読んだもの。**どちらも1行**で、常に同じ高さを取る */
  #zoombar{ display:flex; align-items:center; gap:6px; padding:5px 10px; background:#fafbfc;
            border-bottom:1px solid #eee; flex:0 0 auto; font-size:11px; color:#5f6368;
            white-space:nowrap; overflow:hidden; }
  #zoombar button{ padding:5px 11px; font-size:12px; font-weight:bold; border-radius:6px;
                   border:1px solid var(--pri); background:#fff; color:var(--pri); }
  #zoombar button.on{ background:var(--pri); color:#fff; }
  /* ★★★★ **NG は、はっきり分かること。**（2026-08-17 辻さんのご指示）
       現場は音も聞こえず、手袋で、明るいところで見ます。
       小さな灰色の字では**通ったのと区別が付きません。** */
  #last.ng{ background:#fce8e6; color:#c5221f; font-weight:bold; font-size:14px;
            border-bottom:2px solid #c5221f; }
  #last{ flex:0 0 auto; font-size:13px; padding:6px 10px; background:#fff;
         border-bottom:1px solid var(--bd); line-height:1.4;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #last b{ font-size:14px; }
  #last small{ color:#9aa0a6; font-weight:normal; font-size:10px; margin-left:6px; }

  /* ★★★★ **チェックの画面そのものを、オーダーシートの形にします。**
       （2026-08-17 辻さんのご指示「オーダーシートで確認している感じに」）
       ★ 現場は紙のオーダーシートを見ながら機材を集めます。
         画面が別の並びだと、目が行き来して間違えます。**同じ形にすること。**
       ★★ ここだけスクロールしてよい。 */
  .list{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
         padding:0 0 16px; background:#f6f7f8; }

  .sheetblock{ margin:8px 8px 0; border:1px solid #444; background:#fff; }
  .sheetblock h4{ margin:0; padding:0; background:#e8eaed; font-size:12px;
                  border-bottom:1px solid #444; display:flex; align-items:stretch; }
  .sheetblock h4 .nm{ flex:1; min-width:0; padding:5px 6px; font-weight:bold;
                      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheetrow{ display:flex; align-items:stretch; border-bottom:1px solid #dadce0;
             font-size:13px; min-height:34px; }
  .sheetrow:last-child{ border-bottom:none; }
  .sheetrow.checked{ background:#e6f4ea; }
  .sheetrow.extra{ background:#fff8e1; }
  /* ★ 押せる行と、押せない行（ケーブル等）を見た目で分ける */
  .sheetrow.tap{ cursor:pointer; }
  .sheetrow.notap .t{ color:#5f6368; }
  .sheetrow .t{ flex:1; min-width:0; padding:6px; display:flex; align-items:center;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheetrow .t small{ color:#80868b; margin-left:5px; }

  /* ★★★★ **印は大きく、太く。**（2026-08-17 辻さんのご指示）
       小さいと現場で見落とします。印は見えてこそ意味があります。
     ★★★ 幅は px で決めること（em は字の大きさで変わり、縦線がずれます）。 */
  .sheetblock .w{ width:48px; flex:0 0 48px; box-sizing:border-box;
                  border-left:1px solid #444; text-align:center;
                  display:flex; align-items:center; justify-content:center;
                  font-weight:bold; font-size:17px; line-height:1; }
  .sheetblock h4 .w{ font-size:11px; font-weight:normal; color:#5f6368; }
  .sheetrow .w.qr{ color:#1a73e8; font-size:15px; }
  .sheetrow .w.hand{ color:var(--ok); font-size:22px; }   /* ✓ は細いので、さらに大きく */
  .sheetrow .w.いま{ background:#fff; }
  .sheetnote{ padding:10px 12px 4px; font-size:11px; color:#5f6368; line-height:1.7; }

  .btn{ padding:11px 13px; border:none; border-radius:8px; font-weight:bold; font-size:14px; }

  /* ★★★ 保存中であることを、はっきり見せる */
  #busy{ display:none; flex:0 0 auto; background:#e8f0fe; border-bottom:1px solid #c6dafc;
         padding:8px 10px; }
  #busytext{ font-size:12px; color:#174ea6; font-weight:bold; }
  .busybar{ height:4px; background:#c6dafc; border-radius:2px; overflow:hidden; margin-bottom:6px; }
  .busybar span{ display:block; height:100%; width:40%; background:var(--pri);
                 border-radius:2px; animation:hcxslide 1.1s linear infinite; }
  @keyframes hcxslide{ 0%{ margin-left:-40%; } 100%{ margin-left:100%; } }
  .btn.scan{ background:var(--pri); color:#fff; }
  .btn.save{ background:var(--ok); color:#fff; }
  .msg{ padding:20px; text-align:center; color:#555; font-size:13px; line-height:1.8; }
  .err{ margin:12px; padding:14px; background:#fce8e6; color:#c5221f; border-radius:8px;
        font-size:13px; line-height:1.8; white-space:pre-wrap; }
  .toast{ position:fixed; left:50%; bottom:78px; transform:translateX(-50%); background:rgba(0,0,0,.85);
          color:#fff; padding:10px 16px; border-radius:24px; font-weight:bold; font-size:14px;
          z-index:50; display:none; max-width:90%; text-align:center; }
  .toast.ok{ background:var(--ok); } .toast.warn{ background:var(--warn); } .toast.dup{ background:#e8930c; }
  .pending{ background:#fff3cd; color:#856404; font-size:12px; text-align:center; padding:6px;
            display:none; flex:0 0 auto; }
  #warnbar{ flex:0 0 auto; }
  #ver{ flex:0 0 auto; text-align:center; font-size:10px; color:#9aa0a6; padding:3px 4px;
        background:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>

<!-- ★★★ **上から順に、指を動かさずに全部見えること。**
       ① 持ち出しか返却か　② 案件名　③ 進み具合　④ 倍率　⑤ 直近で読んだ機材名 -->
<header id="topbar">
  <div class="modebar">
    <button id="mOut" class="on">持ち出し</button>
    <button id="mRet">返却</button>
  </div>
  <div class="order" id="orderInfo">読み込み中…</div>
</header>

<!-- ★★ 保存は、カメラのボタンの隣に置きます（2026-08-17 辻さんのご指示）。
     下に固定していた帯をやめたので、機材の一覧がそのぶん広く使えます。 -->
<div class="bar">
  <div class="prog" id="prog">0 / 0 <small>チェック済</small></div>
  <button class="btn scan" id="scanBtn" style="margin-left:auto; padding:8px 10px;">カメラでスキャン</button>
  <button class="btn save" id="saveBtn" style="padding:8px 14px;">保存</button>
</div>

<div id="readerBox"><div id="reader"></div></div>
<!-- ★ 倍率。**使えない端末でも、この行は必ず出します。**
     出ていないと「押す場所が無い」のか「効かない」のかが分かりません -->
<div id="zoombar" style="display:none;"></div>
<!-- ★★★★ **直近で読んだ機材名**（2026-08-17 辻さんのご指示）
     以前は読んだ文字（H:0D5FAED4）を主役にしていました。
     現場が知りたいのは**どの機材が付いたか**です。名前を主役にします。
     読んだ文字は、原因を追うときに要るので、小さく後ろに残します。 -->
<div id="last">直近： <span style="color:#9aa0a6;">まだ読んでいません</span></div>
<div class="pending" id="pending">まだ送れていないチェックがあります。「保存」を押してください。</div>
<!-- ★★★ 仕度が整っていないことを、**読ませる前に**言う（2026-08-16） -->
<div id="warnbar" style="display:none;background:#fce8e6;color:#c5221f;border-bottom:1px solid #f5c6c2;
                         padding:8px 10px;font-size:12px;line-height:1.6;white-space:pre-wrap;"></div>

<div class="list" id="list"><div class="msg">読み込み中…</div></div>

<!-- ★★★ **いま何をしているかを、必ず出すこと。**（2026-08-17 辻さんのご指示）
     14台ぶんの記録を送るのに何秒かかかります。その間に何も出ないと、
     押せていないのかと思って**もう一度押されます。** -->
<div id="busy">
  <div class="busybar"><span></span></div>
  <div id="busytext">記録しています…</div>
</div>


<!-- ★ どの版のサーバーに話しかけているか。2つめのデプロイの更新忘れに気づくため -->
<div id="ver"></div>

<div class="toast" id="toast"></div>

<script>
// ==========================================================
//  設定 — ここだけ書き換えます
// ==========================================================
//
// ★ 機材システムのウェブアプリURL（末尾 /exec）。
//   `?api=` を付けて開けば、その場で差し替えて試せます（試験用）。
// ★★★ **この画面（check.html）自身の版。**
//   サーバーの版とは別物です。GitHub の差し替えを忘れると、
//   ここだけ古いまま気づけません。**直したら必ず1つ上げること。**
//     C7 … カメラの指定を鍵1つに直した（3つ渡してカメラが開かなかった件）
//     C8 … 行き先（2つめのデプロイ）を、いまのものに合わせた（2026-08-17）
//     C9 … 1画面に収めた／読むたびに保存して中断から続けられるようにした（2026-08-17）
//     C10 … ★C9で映像を押しつぶし、QRに反応しなくなったのを直した（2026-08-17）
//     C11 … 一覧を1機材1行に／手で入れる欄を外した（2026-08-17）
//     C12 … 保存をカメラの隣へ／保存したらオーダーシートを出す／QRと手を見分ける（2026-08-17）
//     C13 … サーバーの版が足りないことを、読ませる前に言う（2026-08-17）
//     C14 … 行き先を、作り直したデプロイに合わせた（2026-08-17）
//     C15 … チェック欄を罫線で囲み、縦線をそろえた／保存中を見せるようにした（2026-08-17）
//     C16 … チェックの画面そのものをオーダーシートの形に／印を大きく太く（2026-08-17）
//     C17 … リストに無いものを読んだら、はっきりNGと出す（2026-08-17）
//     C18 … 読み込みにかかった時間と、その内訳を出す（2026-08-19）
//     C19 … 押した側（持出／返却）で開く（?m=return）（2026-08-19）
var 画面の版 = 'C19';

// ★★★★ **この画面が動くのに要る、サーバーの版**（2026-08-17）
//
//   この仕組みは**3つの部品**（1つめのデプロイ／2つめのデプロイ／この画面）が
//   そろって初めて動きます。**2つめのデプロイの更新を忘れる**のが、
//   いちばん多い落とし穴です。しかも失敗の出方が毎回ちがうので、
//   「QRが読めない」「オーダーシートが出ない」と、**別々の不具合に見えます。**
//
//   → 版を突き合わせて、**読ませる前に**そう言います。
var 要るサーバーの版 = 'V4.129.0';   // ★ 押した側（?m=）を返せるのは、この版から

var API_URL = 'https://script.google.com/macros/s/AKfycbwsqBNvhiazVL5hpBRgB01aaXXgwwLUE34u-GWDa71BJH3qg218xY8ToBpNcMwWB_U/exec';

var qs = new URLSearchParams(location.search);
if (qs.get('api')) API_URL = qs.get('api');
var TOKEN = qs.get('t') || '';
// ★★★★ **押した側（持出／返却）で開くこと。**（2026-08-19 辻さんのご指示）
//   ［持出チェック］を押したのに返却の側で開いたら、**間違えて記録されます。**
//   `?m=return` が付いていれば返却、無ければ持出です。
var 最初の側_ = (qs.get('m') === 'return') ? 'return' : 'out';

var 控えの鍵   = 'hcx_check_' + TOKEN;
var 未送信の鍵 = 'hcx_pending_' + TOKEN;
var tick未送信の鍵 = 'hcx_ticks_' + TOKEN;
var 記録者の鍵 = 'hcx_check_by';

var state = { order: null, items: [], mode: 最初の側_,
              // ★ サーバーに残っている「済み」。{ outbound:{eqId:{state,time}}, ret:{…} }
              進み: { outbound: {}, ret: {} } };
var 未送信のtick_ = [];        // 電波が悪くて送れなかったぶん
// ★★★ **どこで待たされているかを、その場で見えるようにします。**（2026-08-19）
//   「遅い」と言われても、当てずっぽうで直しては同じことを繰り返します。
var 読み始め_ = 0;             // 押してから、絵が出るまで
var 内訳_ = null;              // サーバーの中の内訳（ミリ秒）
var 読み取り中 = false;
var スキャナ = null;

function $(id) { return document.getElementById(id); }

// ==========================================================
//  サーバーを呼ぶ
// ==========================================================
//
// ★★★ **`Content-Type` は `text/plain` にすること。**
//   `application/json` にすると、ブラウザが先に OPTIONS を投げます（プリフライト）。
//   Apps Script は OPTIONS に答えられないので、**その時点で失敗します。**
//   `text/plain` なら「ふつうの送信」とみなされ、そのまま通ります。
//   受け側は中身を JSON として読むので、これで困りません。
function 呼ぶ(action, 追加) {
  var body = { kind: 'check', t: TOKEN, action: action };
  for (var k in (追加 || {})) body[k] = 追加[k];
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || '処理に失敗しました。');
      return res.data;
    });
}

// ==========================================================
//  起動
// ==========================================================
document.addEventListener('DOMContentLoaded', function () {
  // ★ 開いた側に合わせて、ボタンの見た目もそろえること
  $('mOut').className = (state.mode === 'out') ? 'on' : '';
  $('mRet').className = (state.mode === 'return') ? 'on' : '';
  $('mOut').addEventListener('click', function () { モードを変える('out'); });
  $('mRet').addEventListener('click', function () { モードを変える('return'); });
  $('scanBtn').addEventListener('click', スキャンの入り切り);
  $('saveBtn').addEventListener('click', 保存する);

  if (!TOKEN) {
    $('list').innerHTML = '<div class="err">この画面は、機材システムの案件から開いてください。\n' +
      '（案件を開いて「📷 QRで持出・返却チェック」を押すと、QRが出ます）</div>';
    return;
  }
  if (localStorage.getItem(未送信の鍵)) $('pending').style.display = 'block';
  // ★ 前回、電波が悪くて送れなかった1点ぶんの記録を拾って、送り直す
  try { 未送信のtick_ = JSON.parse(localStorage.getItem(tick未送信の鍵) || '[]') || []; }
  catch (e) { 未送信のtick_ = []; }
  if (未送信のtick_.length) たまったtickを送る_();
  素性を出す('', '読み込み中…');      // ★ 読む前から、行き先だけは見えるようにする
  一覧を読む();
});

// ==========================================================
//  案件の機材を読む
// ==========================================================
function 一覧を読む() {
  読み始め_ = Date.now();
  呼ぶ('order')
    .then(function (d) {
      state.order = d.order;
      // ★★★ **印の読み方は、こちらに持ちません。**（2026-08-16）
      //   サーバーから「印」と「機材ごとの文字」をもらい、突き合わせるだけにします。
      //   ここに読み方を書き写すと、システム側と食い違ったときに
      //   **貼り終わったラベルが全部読めなくなります。**しかも誰も気づけません。
      // ★ 印は**複数**受け取ります（古い形のラベルも通すため）
      state.印たち = (d.qrPrefixes && d.qrPrefixes.length) ? d.qrPrefixes
                                                          : [d.qrPrefix].filter(Boolean);
      // ★★★ **どの版のサーバーに話しかけているかを出します。**（2026-08-16）
      //   この画面は「2つめのデプロイ」（公開範囲「全員」）を見ています。
      //   デプロイは版に固定されるので、**そちらを更新し忘れると古いまま動きます。**
      //   システム側の版と違っていたら、2つめのデプロイを更新してください。
      内訳_ = d.ms || null;      // ★ どこで待たされたかの内訳（サーバーが入れてきます）
      版を出す(d.version);
      state.items = (d.items || []).map(function (x) {
        return { eqId: x.eqId, name: x.name, no: x.no, category: x.category,
                 qr: x.qr || '', checked: false, extra: false };
      });
      // ★★★ **前回の続きを戻します。**（2026-08-17 辻さんのご指示）
      //   現場では、点検の途中で電話が入る・電池が切れる・アプリが落ちる、が普通に起きます。
      //   そこまでの手間を捨てさせないこと。
      state.進み = d.progress || { outbound: {}, ret: {} };
      // ★★★★ **チェックの画面そのものを、オーダーシートの形にします。**
      state.枠 = d.sheet || null;
      localStorage.setItem(控えの鍵, JSON.stringify(
        { order: d.order, items: d.items, 印たち: state.印たち, at: Date.now() }));
      案件を出す();
      続きを当てる_();
      描く();
      続きを知らせる_();
      古いサーバーでないか確かめる_(d);
    })
    .catch(function (e) {
      // ★★★ **黙って空にしないこと。**
      //   ここで「0台」と出すと、現場は「この案件は機材が無い」と読みます。
      //   電波が悪いだけのこともあるので、前に読んだものがあれば、そう断って出します。
      var 控え = null;
      try { 控え = JSON.parse(localStorage.getItem(控えの鍵) || 'null'); } catch (e2) {}
      if (控え && 控え.items) {
        state.order = 控え.order;
        state.印たち = 控え.印たち || [];
        state.items = 控え.items.map(function (x) {
          return { eqId: x.eqId, name: x.name, no: x.no, category: x.category,
                   qr: x.qr || '', checked: false, extra: false };
        });
        案件を出す();
        描く();
        知らせる('つながらないので、前に読んだ一覧を出しています', 'warn');
        return;
      }
      $('list').innerHTML = '';
      var d = document.createElement('div');
      d.className = 'err';
      // ★★★ **理由をそのまま出すこと。**「読めませんでした」だけでは何も分かりません
      d.textContent = '機材の一覧を読めませんでした。\n\n' +
                      '【理由】' + ((e && e.message) || e) +
                      '\n\n電波を確かめて、画面を開き直してください。';
      $('list').appendChild(d);
      // ★★★ **しくじったときこそ、素性を出すこと。**（2026-08-16）
      //   版と印は、うまくいったときにしか出していませんでした。
      //   **原因を知りたいのは、しくじったとき**です。逆でした。
      素性を出す('', 'サーバーに届かないか、断られました');
    });
}

/**
 * ★★★ **古いサーバーに話しかけていたら、読ませる前に言うこと。**（2026-08-16）
 *
 *   2026-08-16、辻さんが正しいラベル（`H:0D5FAED4`）を読ませたのに
 *   「この機材のQRではありません」と出ました。
 *   原因は**2つめのデプロイが古かった**こと。印も、機材ごとの文字も
 *   返ってきていませんでした。
 *
 *   ★ これは**読む前から分かっていたこと**です。
 *     それを、読ませてから1点ずつ分かりにくい形で伝えていました。
 *     **仕度が整っていないなら、最初にそう言うべき**でした。
 */
function 古いサーバーでないか確かめる_(d) {
  var 印なし = !(state.印たち && state.印たち.length);
  var 文字なし = (state.items || []).length > 0 &&
                 !state.items.some(function (x) { return x.qr; });
  // ★★★★ **版そのものを突き合わせます。**（2026-08-17）
  //   印も文字も届いてはいるが、**新しい機能だけが無い**、という中途半端な古さが
  //   いちばん厄介です。「オーダーシートが出せません」だけが出て、
  //   原因（デプロイの更新忘れ）にたどり着けません。
  var 版が足りない = 版が古い_(d && d.version, 要るサーバーの版);
  if (!印なし && !文字なし && !版が足りない) { 帯を消す_(); return; }

  var 頭 = 版が足りない
    ? ('⚠️ サーバーが古いままです（届いた版 ' + ((d && d.version) || '不明') +
       ' ／ 要る版 ' + 要るサーバーの版 + '）\n' +
       'このままだと、オーダーシートが出せません。QRも読めないことがあります。\n')
    : ('⚠️ このままではQRを読んでもチェックできません（サーバーが古いままです）\n');
  帯を出す_(頭 +
    'GASエディタ →［デプロイ］→［デプロイを管理］→ ' +
    '**2つめ（QRチェック用API）の ✏️** → バージョン「新バージョン」→［デプロイ］\n' +
    'そのあと、この画面を開き直してください。');
}

/**
 * 版を数で比べる（'V4.100.0' は 'V4.99.0' より新しい）
 *
 * ★★ **文字のまま比べてはいけません。** 文字だと 'V4.100.0' < 'V4.99.0' になります。
 * ★ 分からない形なら「古くない」とみなします。**動いているものを止めないため**です。
 */
function 版が古い_(いま, 要る) {
  var a = 数にする_(いま), b = 数にする_(要る);
  if (!a || !b) return false;
  for (var i = 0; i < 3; i++) {
    if ((a[i] || 0) < (b[i] || 0)) return true;
    if ((a[i] || 0) > (b[i] || 0)) return false;
  }
  return false;
}

function 数にする_(v) {
  var m = String(v || '').match(/^V(\d+)\.(\d+)\.(\d+)/);
  return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
}

function 帯を出す_(文) {
  var e = $('warnbar');
  if (!e) return;
  e.textContent = 文;
  e.style.display = 'block';
}
function 帯を消す_() {
  var e = $('warnbar');
  if (e) e.style.display = 'none';
}

/**
 * 案件を**1行**で出す（2026-08-17）
 *   高さを動かさないため、折り返しません。長ければ … で切れます。
 *   ★ 切れて読めないと困るので、押したら全部を出します。
 */
function 案件を出す() {
  var o = state.order || {};
  var e = $('orderInfo');
  e.innerHTML = '';
  var b = document.createElement('b');
  b.textContent = o.projectName || '（案件名なし）';
  var sm = document.createElement('small');
  sm.textContent = '　' + (o.staffName || '') + '　' + 短く(o.start) + '〜' + 短く(o.end);
  e.appendChild(b); e.appendChild(sm);
  e.title = b.textContent + sm.textContent;
  e.onclick = function () { alert(e.title); };
}

/**
 * ★★★ サーバーに残っている「済み」を、いまのモードに当てる
 *   予約に無いもの（予約外）が残っていたら、それも足して戻します。
 *   **戻し忘れると、現場はもう一度ぜんぶ読み直すことになります。**
 */
function 続きを当てる_() {
  var 箱 = (state.mode === 'return') ? (state.進み.ret || {}) : (state.進み.outbound || {});
  state.items.forEach(function (it) {
    var p = 箱[String(it.eqId)];
    it.checked = !!(p && p.state !== '未チェック');
    // ★ サーバーから戻したものは、もう保存済み（＊を付けない）
    it.保存済み = it.checked && !(p && p.wip);
    // ★ 読み方も戻すこと。戻さないと、続きから保存した拍子に
    //   **QRで読んだものが「手で押した」に化けます**
    it.how = (it.checked && p && p.how) ? p.how : (it.checked ? '手' : '');
  });
  // ★ 一覧に無い機材が残っていたら、「予約外」として戻す
  var ある = {};
  state.items.forEach(function (it) { ある[String(it.eqId)] = true; });
  Object.keys(箱).forEach(function (id) {
    if (ある[id]) return;
    if (箱[id].state === '未チェック') return;
    state.items.push({ eqId: id, name: id, no: '', category: '', qr: '',
                       checked: true, extra: true, how: 箱[id].how || '手',
                       保存済み: !箱[id].wip });
  });
}

/** 続きから始まったことを、黙らずに言う */
function 続きを知らせる_() {
  var 済 = state.items.filter(function (x) { return x.checked; }).length;
  if (!済) return;
  知らせる('前回の続きから（' + 済 + ' 件は済み）', 'ok');
  読んだものを出す('', '前回の続きから始めます（' + 済 + ' 件は済み）', 'ok', '');
}

function 短く(s) {
  var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[2] + '/' + m[3]) : String(s || '');
}

// ==========================================================
//  持ち出し／返却
// ==========================================================
//
// ★★ **切り替えたらチェックは消します。** 持出と返却は別の記録です。
//   残したままにすると、返却のつもりで持出のチェックを保存してしまいます。
/**
 * ★★ 持出と返却は**別の記録**です。切り替えたら、そのモードのぶんを出します。
 *
 *   ★★★ 前は「切り替えるとチェックを消す」でした。**もう消しません。**（2026-08-17）
 *     読むたびにサーバーへ残しているので、切り替えて戻っても済みは残ります。
 *     消していたころは、間違えて押しただけで手間がまるごと飛びました。
 */
function モードを変える(m) {
  if (state.mode === m) return;
  state.mode = m;
  $('mOut').className = (m === 'out') ? 'on' : '';
  $('mRet').className = (m === 'return') ? 'on' : '';
  続きを当てる_();
  描く();
}

// ==========================================================
//  描く
// ==========================================================
function 描く() {
  var box = $('list');
  box.innerHTML = '';

  // ★ 枠がまだ届いていない（古いサーバー）なら、素の一覧で出す。
  //   **黙って何も出さないことだけは、しないこと。**
  if (!state.枠 || !(state.枠.left || state.枠.right)) { 素の一覧で描く_(box); 進み具合を出す_(); return; }

  var 枠たち = (state.枠.left || []).concat(state.枠.right || []);
  枠たち.forEach(function (b) { box.appendChild(枠を描く_(b)); });

  // ★★ 予約に無いのに読んだもの（予約外）は、**必ずどこかに出すこと。**
  //   出さないと、数が合わない原因が追えなくなります。
  var 予約外 = state.items.filter(function (x) { return x.extra; });
  if (予約外.length) {
    box.appendChild(枠を描く_({ title: '予約外（読んで足したもの）',
      items: 予約外.map(function (x) {
        return { maker: '', name: x.name || x.eqId, no: x.no || '', eqId: x.eqId };
      }) }));
  }

  var 注 = document.createElement('div');
  注.className = 'sheetnote';
  注.textContent = 'QR … QRを読んで付けた　／　✓ … 指で押して付けた　／　' +
                   '＊ … まだ保存していない　／　行を押しても付け外しできます';
  box.appendChild(注);

  進み具合を出す_();
}

/** 枠（カテゴリ）1つぶん */
function 枠を描く_(b) {
  var 枠 = document.createElement('div');
  枠.className = 'sheetblock';

  var 見出し = document.createElement('h4');
  var t = document.createElement('span');
  t.className = 'nm';
  t.textContent = b.title || '';
  見出し.appendChild(t);
  ['持出', '返却'].forEach(function (名, i) {
    var w = document.createElement('span');
    w.className = 'w';
    w.textContent = 名;
    // ★ いま付けているほうを、白地で目立たせる
    if ((i === 0) === (state.mode !== 'return')) w.style.background = '#fff';
    見出し.appendChild(w);
  });
  枠.appendChild(見出し);

  var items = b.items || [];
  if (!items.length) {
    枠.appendChild(行を作る_({ name: '\u00a0' }, null));
    return 枠;
  }
  items.forEach(function (e) {
    // ★ 機材だけが押せます。ケーブル・メディア・レンタルには機材IDがありません
    var it = e.eqId ? 手元の機材_(e.eqId) : null;
    枠.appendChild(行を作る_(e, it));
  });
  return 枠;
}

function 手元の機材_(eqId) {
  for (var i = 0; i < state.items.length; i++) {
    if (String(state.items[i].eqId) === String(eqId)) return state.items[i];
  }
  return null;
}

function 行を作る_(e, it) {
  var 行 = document.createElement('div');
  行.className = 'sheetrow' + (it && it.checked ? ' checked' : '') +
                 (it && it.extra ? ' extra' : '') + (it ? ' tap' : ' notap');

  var 名 = document.createElement('div');
  名.className = 't';
  名.textContent = (e.maker ? e.maker + ' ' : '') + (e.name || '');
  if (e.no) {
    var sm = document.createElement('small');
    sm.textContent = e.no;
    名.appendChild(sm);
  }
  名.title = 名.textContent;
  行.appendChild(名);

  行.appendChild(印の欄_(印の中身_(it, 'out')));
  行.appendChild(印の欄_(印の中身_(it, 'ret')));

  if (it) {
    行.addEventListener('click', function () {
      it.checked = !it.checked;
      // ★ 指で押して**付けた**ときだけ残します（外したときは残しません）
      if (it.checked) 一点だけ残す_(it, '手');
      描く();
    });
  }
  return 行;
}

/**
 * その機材の、その欄に出すもの
 *
 * ★ いま付けているほう（モード）は**手元の状態**を、
 *   もう片方は**サーバーに残っているもの**を出します。
 */
function 印の中身_(it, 枠) {
  if (!it) return null;
  var いまの枠 = (state.mode === 'return') ? 'ret' : 'out';
  if (枠 === いまの枠) {
    if (!it.checked) return null;
    return { state: it.extra ? '予約外' : 'OK', how: it.how || '手', wip: !it.保存済み };
  }
  var 箱 = (枠 === 'ret') ? (state.進み.ret || {}) : (state.進み.outbound || {});
  return 箱[String(it.eqId)] || null;
}

/** 「QR」「✓」「空」。＊は、まだ保存していないもの */
function 印の欄_(x) {
  var e = document.createElement('div');
  e.className = 'w';
  if (!x || !x.state || x.state === '未チェック') { e.innerHTML = '&nbsp;'; return e; }
  var QRか = (x.how === 'QR');
  e.className = 'w ' + (QRか ? 'qr' : 'hand');
  e.textContent = (QRか ? 'QR' : '✓') + (x.wip ? '＊' : '');
  return e;
}

/**
 * ★ 枠が届かないとき（古いサーバー）の、素の一覧
 *   **黙って何も出さないことだけは、しないこと。**
 */
function 素の一覧で描く_(box) {
  if (!state.items.length) {
    box.innerHTML = '<div class="msg">この案件に機材の予約がありません。</div>';
    return;
  }
  var 枠 = document.createElement('div');
  枠.className = 'sheetblock';
  var 見出し = document.createElement('h4');
  var t = document.createElement('span');
  t.className = 'nm';
  t.textContent = '機材（オーダーシートの形が届いていません）';
  見出し.appendChild(t);
  ['持出', '返却'].forEach(function (名) {
    var w = document.createElement('span'); w.className = 'w'; w.textContent = 名;
    見出し.appendChild(w);
  });
  枠.appendChild(見出し);
  state.items.forEach(function (it) {
    枠.appendChild(行を作る_({ maker: '', name: it.name || it.eqId, no: it.no || '',
                               eqId: it.eqId }, it));
  });
  box.appendChild(枠);
}

function 進み具合を出す_() {
  var 済 = state.items.filter(function (x) { return x.checked; }).length;
  $('prog').innerHTML = 済 + ' / ' + state.items.length + ' <small>チェック済</small>';
}

// ==========================================================
//  読み取り
// ==========================================================
/**
 * ★★★ **小さいQRを読みやすくする2つの手** （2026-08-16 辻さんのご指示）
 *
 *   ① **写す細かさを上げる**（解像度）
 *      1マスに当たる画素が増えます。**どの端末でも効きます。**
 *   ② **カメラのズーム**（2倍）
 *      レンズ側で寄ります。**効かない端末があります**（iPhoneのSafariは
 *      ズームを触らせてくれないことが多い）。
 *
 *   ★ ①は黙って必ず入れます。②は**使える端末でだけ**入れ、
 *     使えないときは**そう画面に出します**（黙って何もしない、をやめる）。
 *
 *   ★★ 倍率は覚えます。現場で毎回押し直さなくて済むように。
 */
var 倍率 = Number(localStorage.getItem('HCX_ZOOM') || '2') || 2;
var ズーム機能 = null;      // 使える端末でだけ入る
var 開いた細かさ_ = '';     // どの注文で開けたか（画面に出します）

function スキャンの入り切り() {
  if (読み取り中) { スキャンを止める(); return; }
  if (typeof Html5Qrcode === 'undefined') {
    知らせる('カメラの部品が読み込めていません。手で入れてください', 'warn');
    return;
  }
  $('readerBox').style.display = 'block';
  スキャナ = new Html5Qrcode('reader');

  // ★★★ **カメラの指定は「キーちょうど1つ」でなければ通りません。**
  //   （2026-08-16、辻さんのカメラが開かなくなりました。**私の書き間違い**です）
  //
  //     'cameraIdOrConfig' object should have exactly 1 key,
  //      if passed as an object, found 3 keys
  //
  //   `{ facingMode, width, height }` と3つ渡していました。
  //   写す細かさは、**開いたあとに**別の命令（`applyVideoConstraints`）で頼みます。
  //
  //   ★★ おまけ（細かさ・ズーム）のために、本業（読み取り）を止めないこと。
  //     開くほうを先に済ませ、細かさは**開いたあとに、失敗してもよい形で**足します。
  順に開く_([
    { 名: '外カメラ', c: { facingMode: 'environment' } },   // ★ キーは1つだけ
    { 名: '最後の砦', c: true }                              // どれも通らない端末のため
  ], 0);
}

/**
 * ★ 指定を1つずつ試す。**どれかで開けばよい。**
 *   全部だめだったときだけ、**最後の理由を添えて**知らせます。
 */
function 順に開く_(注文たち, i) {
  if (i >= 注文たち.length) return;
  var 今 = 注文たち[i];
  スキャナ.start(
    今.c,
    { fps: 10, qrbox: 読み取り枠_() },
    function (text) { 読んだ(text); },
    function () { /* 読めなかったコマは、いちいち言わない */ }
  ).then(function () {
    読み取り中 = true;
    $('scanBtn').textContent = 'カメラを止める';
    細かさを上げる_();          // ★ 開いたあとに頼む。失敗しても、カメラは開いたまま
    ズームを用意する_();
    カメラを真ん中に寄せる_();  // ★ 読み取る四角は映像の真ん中。そこを箱に見せる
  }).catch(function (e) {
    if (i + 1 < 注文たち.length) { 順に開く_(注文たち, i + 1); return; }
    $('readerBox').style.display = 'none';
    if ($('zoombar')) $('zoombar').style.display = 'none';
    知らせる('カメラを開けませんでした: ' + ((e && e.message) || e), 'warn');
    読んだものを出す('', 'カメラを開けませんでした：' + ((e && e.message) || e), 'warn', '');
  });
}

/**
 * ★★★★ 映像の真ん中（＝読み取る四角があるところ）を、箱に見せる
 *
 *   映像は素の形のまま（縦長のことが多い）なので、
 *   箱（画面の3分の1）に入りきりません。**上へずらして真ん中を見せます。**
 *
 *   ★ ここでしくじっても、読み取りそのものは効いています。
 *     見えている場所がずれるだけなので、**握りつぶさずに、ずらさないだけ**にします。
 */
function カメラを真ん中に寄せる_() {
  try {
    var 箱 = $('readerBox'), 中 = $('reader');
    if (!箱 || !中) return;
    var v = 中.querySelector('video');
    if (!v) return;
    var やる = function () {
      var 映像の高さ = v.clientHeight || 中.clientHeight;
      var 箱の高さ = 箱.clientHeight;
      if (!映像の高さ || !箱の高さ) return;
      var ずらす = Math.round((箱の高さ - 映像の高さ) / 2);
      中.style.position = 'relative';
      中.style.top = (ずらす < 0 ? ずらす : 0) + 'px';
    };
    やる();
    // ★ 映像の大きさが決まるのは、再生が始まってから。少しあとにもう一度当てる
    setTimeout(やる, 300);
    setTimeout(やる, 1200);
    window.removeEventListener('resize', カメラを真ん中に寄せる_);
    window.addEventListener('resize', カメラを真ん中に寄せる_);
  } catch (e) { /* ずらせないだけ。読み取りは効いています */ }
}

/**
 * ★★ 写す細かさを上げる（1マスに当たる画素を増やす）
 *
 *   ★★★ **ここでしくじっても、カメラは開いたままにすること。**
 *     細かさは「読みやすくするためのおまけ」です。
 *     おまけのために、読み取りそのものを止めてはいけません。
 */
function 細かさを上げる_() {
  開いた細かさ_ = 'ふつう';
  try {
    スキャナ.applyVideoConstraints({ width: { ideal: 1920 }, height: { ideal: 1080 } })
      .then(function () { 開いた細かさ_ = '高'; ズームを用意する_(); })
      .catch(function () { /* この端末では上げられません。ふつうのまま続けます */ });
  } catch (e) { /* 同上 */ }
}

/**
 * 読み取る四角の大きさ
 *
 * ★★★ **カメラの箱の大きさから決めること。**（2026-08-17）
 *   前は画面全体の大きさから決めていたので、カメラを画面の3分の1にしたあと
 *   **枠が箱からはみ出しました**（辻さんのご指摘「枠が大きすぎる」）。
 *   はみ出すと、部品が「枠が映像より大きい」と言って開かないことがあります。
 */
function 読み取り枠_() {
  var 箱 = $('readerBox');
  var w = (箱 && 箱.clientWidth)  || window.innerWidth;
  var h = (箱 && 箱.clientHeight) || Math.round(window.innerHeight / 3);
  // ★ 箱に収まる大きさにすること。箱より大きいと、四角の上下が見えません
  var n = Math.round(Math.min(w, h) * 0.72);
  return { width: Math.max(140, Math.min(260, n)),
           height: Math.max(140, Math.min(260, n)) };
}

/**
 * ★★ カメラのズームが使えるか確かめて、使えれば倍率を当てる
 *
 *   ★ 使えないときは**黙らないこと。** 「この端末では効きません」と出します。
 *     効いていないのに倍率ボタンだけ出ていると、押しても何も起きません。
 */
function ズームを用意する_() {
  ズーム機能 = null;
  try {
    var 能力 = スキャナ.getRunningTrackCameraCapabilities();
    var z = 能力 && 能力.zoomFeature && 能力.zoomFeature();
    if (z && z.isSupported()) ズーム機能 = z;
  } catch (e) { ズーム機能 = null; }

  var 箱 = $('zoombar');
  if (!箱) return;
  箱.style.display = 'flex';
  箱.innerHTML = '';
  箱.appendChild(ふだんの字_('倍率'));

  // ★★★ 使えない端末でも、**この行は必ず出します。**
  //   何も出ないと「押す場所が無い」のか「効かない」のかが分かりません。
  if (!ズーム機能) {
    箱.appendChild(ふだんの字_('1倍（この端末では変えられません）'));
    箱.appendChild(ふだんの字_('／ 写す細かさ ' + (開いた細かさ_ || '—')));
    return;
  }
  var 最大 = 4;
  try { 最大 = Math.min(4, ズーム機能.max() || 4); } catch (e) { 最大 = 4; }
  [1, 2, 3].forEach(function (n) {
    if (n > 最大) return;
    var b = document.createElement('button');
    b.className = (n === 倍率) ? 'on' : '';
    b.textContent = n + '倍';
    b.addEventListener('click', function () { 倍率を変える_(n); });
    箱.appendChild(b);
  });
  箱.appendChild(ふだんの字_('／ 写す細かさ ' + (開いた細かさ_ || '—')));
  倍率を当てる_();
}

function ふだんの字_(t) {
  var e = document.createElement('span');
  e.textContent = t;
  return e;
}

function 倍率を変える_(n) {
  倍率 = n;
  try { localStorage.setItem('HCX_ZOOM', String(n)); } catch (e) {}
  倍率を当てる_();
  ズームを用意する_();          // ボタンの色を塗り直す
}

function 倍率を当てる_() {
  if (!ズーム機能) return;
  try { ズーム機能.apply(倍率); }
  catch (e) { 知らせる('ズームを変えられませんでした', 'warn'); }
}

function スキャンを止める() {
  if (!スキャナ) return;
  スキャナ.stop().then(function () {
    スキャナ.clear();
    スキャナ = null;
    読み取り中 = false;
    $('readerBox').style.display = 'none';
    $('scanBtn').textContent = 'カメラでスキャン';
    if ($('zoombar')) $('zoombar').style.display = 'none';
  }).catch(function () { /* 止められなくても、画面は閉じる */
    読み取り中 = false;
    $('readerBox').style.display = 'none';
    $('scanBtn').textContent = 'カメラでスキャン';
    if ($('zoombar')) $('zoombar').style.display = 'none';
  });
}

var 直前 = { text: '', at: 0 };

/**
 * QRを1つ読んだ
 *
 * ─────────────────────────────────────────────────────────────
 * ★★★ **順番が大事です。**（2026-08-16、辻さんに3度も同じ目に遭わせました）
 *
 *   ① **まず一覧と突き合わせる。**
 *      サーバーがくれた「その案件の機材の文字」と同じなら、**それで確定**です。
 *      印が何であろうと関係ありません。
 *   ② 当たらなかったときだけ、「うちのQRか」を印で見ます。
 *   ③ うちのQRなら、サーバーに何の機材かを聞きます。
 *
 *   ★ 前は①より先に②をやっていました。そのため、
 *     **システム側とこの画面で印の決め方が1つずれただけで、
 *     正しいラベルまで「この機材のQRではありません」**になりました。
 *     ここは**3つの部品（システム／2つめのデプロイ／この画面）**がそろって
 *     はじめて合う場所です。1つ古いだけで、そうなります。
 *
 *   ★★ 順番を入れ替えると、**ずれていても正しいラベルは通ります。**
 *     印は「よそのバーコードを弾く」ためだけに使います。それが本来の役目です。
 * ─────────────────────────────────────────────────────────────
 */
function 読んだ(text) {
  var t = String(text || '').trim();
  // ★ 同じものを続けて読んでも、1回だけ数える（カメラは毎秒何度も読みます）
  if (t === 直前.text && Date.now() - 直前.at < 2500) return;
  直前 = { text: t, at: Date.now() };

  // ① まず一覧と突き合わせる（当たれば、印は見ません）
  if (一覧に当てる(t, t, 'QR')) return;

  // ② 当たらない。うちのQRか？
  if (!うちの印か(t)) {
    // ★ 印が届いていないのは**サーバーが古い**からです。QRのせいにしないこと
    if (!(state.印たち && state.印たち.length)) {
      読んだものを出す(t, 'サーバーが古いため、確かめられません（上の赤い帯を見てください）', 'ng', '');
      知らせる('サーバーが古いままです', 'ng');
      鳴らす(false);
      return;
    }
    読んだものを出す(t, 'この案件の機材ではなく、うちのQRでもありません' +
                        印の説明_(), 'ng', '');
    知らせる('うちのQRではありません', 'ng');
    鳴らす(false);
    return;
  }

  // ③ うちのQRだが、この案件の一覧に無い → サーバーに聞く
  サーバーに聞く(t, t);
}

/** うちのQRか（印は**サーバーからもらったもの**を使う。写しを作らない） */
function うちの印か(t) {
  var 印たち = state.印たち || [];
  for (var i = 0; i < 印たち.length; i++) {
    if (印たち[i] && t.indexOf(印たち[i]) === 0) return true;
  }
  return false;
}

function 印の説明_() {
  var 印たち = (state.印たち || []).filter(Boolean);
  return 印たち.length ? '（うちのQRは「' + 印たち.join('」か「') + '」で始まります）'
                       : '（印がまだ届いていません。画面を開き直してください）';
}

/**
 * その案件の一覧と突き合わせる
 * @return {boolean} 当たったか
 */
function 一覧に当てる(値, 生, 読み方) {
  var v = String(値 || '').trim().toLowerCase();
  if (!v) return false;
  var hit = null;
  for (var i = 0; i < state.items.length; i++) {
    var it = state.items[i];
    // ★★ **サーバーがくれた文字と突き合わせるだけ。**こちらで組み立てません
    if (String(it.qr || '').toLowerCase() === v ||
        String(it.eqId).toLowerCase() === v ||
        String(it.no).toLowerCase() === v) { hit = it; break; }
  }
  if (!hit) return false;

  if (hit.checked) {
    読んだものを出す(生, 'もう付いています', 'ok', hit.name || hit.eqId);
    知らせる('もう読んでいます: ' + (hit.name || hit.eqId), 'dup');
    return true;
  }
  hit.checked = true;
  描く();
  読んだものを出す(生, '✓ 付けました', 'ok', hit.name || hit.eqId);
  知らせる('✓ ' + (hit.name || hit.eqId), 'ok');
  鳴らす(true);
  一点だけ残す_(hit, 読み方);   // ★ 中断してもここまでは残る
  return true;
}

// ==========================================================
//  1点ずつ残す（中断しても、続きから）
// ==========================================================
//
// ★★★ **［保存］を押すまで何も残らない、をやめます。**（2026-08-17 辻さんのご指示）
//   現場では、点検の途中で電話が入る・電池が切れる・アプリが落ちる、が普通に起きます。
//   そこまで積み上げた手間を、こちらの都合で捨てさせないこと。
//
// ★★ **手は止めません。** 送るのは裏でやり、返事は待ちません。
//   1点読むたびに1〜2秒固まったら、現場では使いものになりません。
//
// ★ 送れなかったぶんは端末に貯め、**次に送れたときに一緒に送ります。**
//   最後に［保存］を押せば全件まとめて送るので、そこでも必ず追いつきます。

function 一点だけ残す_(it, 読み方) {
  it.保存済み = false;                 // ★ 読んだばかりのものは、まだ保存前（＊が付く）
  var 荷 = { eqId: it.eqId, checked: !!it.checked, extra: !!it.extra,
             // ★★★ **QRで読んだか、指で押したか。**（2026-08-17 辻さんのご指示）
             //   「現物を見てQRを読んだ」のか「見ずに押した」のかは、
             //   積み忘れを追うときに意味が変わります。同じ扱いにしないこと。
             how: (読み方 === 'QR') ? 'QR' : '手' };
  it.how = 荷.how;
  // ★ 手元の「済み」も、その場で更新する（モードを行き来しても消えないように）
  var 箱 = (state.mode === 'return') ? 'ret' : 'outbound';
  if (!state.進み[箱]) state.進み[箱] = {};
  state.進み[箱][String(it.eqId)] = { state: it.extra ? '予約外' : 'OK',
                                       time: new Date().toISOString() };
  未送信のtick_.push({ mode: state.mode, one: 荷 });
  tickを控える_();
  たまったtickを送る_();
}

function tickを控える_() {
  try {
    if (未送信のtick_.length) localStorage.setItem(tick未送信の鍵, JSON.stringify(未送信のtick_));
    else localStorage.removeItem(tick未送信の鍵);
  } catch (e) { /* 端末がいっぱいでも、読み取りは続ける */ }
}

var 送信中_ = false;
function たまったtickを送る_() {
  if (送信中_ || !未送信のtick_.length) return;
  送信中_ = true;
  var 今 = 未送信のtick_[0];
  呼ぶ('tick', { mode: 今.mode, one: 今.one })
    .then(function () {
      未送信のtick_.shift();
      tickを控える_();
      送信中_ = false;
      if (未送信のtick_.length) たまったtickを送る_();   // 続けて送る
    })
    .catch(function () {
      // ★ 送れないだけ。**読み取りは止めない。**次の1点か［保存］で追いつきます
      送信中_ = false;
    });
}

/** 一覧に無いものを、サーバーに聞く（黙って足しません） */
function サーバーに聞く(値, 生) {
  呼ぶ('find', { eqId: 値 })
    .then(function (d) {
      if (!d.found) {
        読んだものを出す(生, 'この機材は、機材マスタに載っていません', 'ng', '');
        知らせる('登録の無い機材です', 'ng'); 鳴らす(false); return;
      }
      var m = d.item;
      // ★★★★ **リストに無いものは、はっきりNGと伝えること。**（2026-08-17 辻さんのご指示）
      //   黙って確認の小窓だけ出していたので、
      //   「読めたのか／通ったのか」が現場で分かりませんでした。
      読んだものを出す(生, 'この案件の予約にありません', 'ng', m.name || m.eqId);
      知らせる('❌ 予約にありません: ' + (m.name || m.eqId), 'ng');
      鳴らす(false);
      if (!confirm('❌ この機材は、この案件の予約にありません。\n\n' +
                   (m.name || m.eqId) + '　' + (m.no || '') + '\n\n' +
                   'それでも「予約外」として記録に足しますか？\n' +
                   '（足すと、オーダーシートの下に「予約外」として出ます）')) {
        読んだものを出す(生, '足しませんでした（予約にありません）', 'ng', m.name || m.eqId);
        return;
      }
      var 足した = { eqId: m.eqId, name: m.name, no: m.no, category: m.category,
                     qr: m.qr || '', checked: true, extra: true };
      state.items.push(足した);
      描く();
      読んだものを出す(生, '予約外として足しました', 'ok', m.name || m.eqId);
      知らせる('予約外として足しました', 'ok');
      一点だけ残す_(足した, 'QR');
    })
    .catch(function (e) { 知らせる(((e && e.message) || e), 'warn'); });
}

function 鳴らす(よい) {
  try { if (navigator.vibrate) navigator.vibrate(よい ? 40 : [60, 60, 60]); } catch (e) {}
}

function 版を出す(v) { 素性を出す(v, ''); }

/**
 * この画面の素性を出す（版・印・行き先）
 *
 * ★★★ **うまくいかないときこそ、これが要ります。**（2026-08-16）
 *   はじめは「読めたとき」にしか出していませんでした。**逆でした。**
 *   読めなかったときは何も出ず、辻さんに手がかりが残りませんでした。
 */
function 素性を出す(v, ひとこと) {
  var e = document.getElementById('ver');
  if (!e) return;
  var 印 = (state.印たち || []).join(' / ') || '（届いていません）';
  var 行 = [];
  行.push('画面 ' + 画面の版);          // ★ この check.html 自身の版（差し替え忘れが見える）
  行.push(v ? ('サーバー ' + v) : 'サーバー 不明');
  行.push('印 ' + 印);
  // ★ どこへ話しかけているかも出す（2つめのデプロイのURLを取り違えていないか）
  行.push('行き先 …' + String(API_URL).slice(-22));
  // ★ かかった時間を出す。**遅いときに、どこが遅いのかが分かること**
  if (読み始め_) {
    var 全 = ((Date.now() - 読み始め_) / 1000).toFixed(1) + '秒';
    行.push('読み込み ' + 全 +
            (内訳_ ? '（サーバー ' + Math.round(内訳_.合計) + 'ms＝予約' + 内訳_.予約 +
                     '/済み' + 内訳_.済み + '/枠' + 内訳_.枠 + '）' : ''));
  }
  if (ひとこと) 行.push(ひとこと);
  e.textContent = 行.join('　／　');
  e.style.color = v ? '#9aa0a6' : '#c5221f';
  e.style.display = 'block';
}

/**
 * ★★★ 最後に読んだものを、消えない形で出す
 *
 *   「反応しません」の中身は、いつも次のどれかです。
 *     ① そもそもカメラが読めていない（ここに何も出ません）
 *     ② 読めたが、うちのQRではない（印が違う）
 *     ③ 読めたが、この案件の予約に無い
 *     ④ 読めて、ちゃんと付いた
 *   **どれなのかが分からないと、手の打ちようがありません。**
 */
function 読んだものを出す(生, 結果, 種類, 機材名) {
  var e = $('last');
  if (!e) return;
  e.style.display = 'block';
  // ★★★★ **NG は、ひと目で分かること。**（2026-08-17 辻さんのご指示）
  //   これまでは小さな赤い字だけでした。現場では通ったのと見分けが付きません。
  var NGか = (種類 === 'ng');
  e.className = NGか ? 'ng' : '';
  e.style.color = NGか ? '' :
                  ((種類 === 'ok') ? '#137333' : (種類 === 'warn' ? '#c5221f' : '#5f6368'));
  e.innerHTML = '';
  e.appendChild(document.createTextNode(NGか ? '❌ NG　' : '直近： '));
  // ★★★★ **機材名が主役。**（2026-08-17 辻さんのご指示）
  //   現場が知りたいのは「どの機材が付いたか」であって、QRの文字ではありません。
  if (機材名) {
    var b = document.createElement('b');
    b.textContent = 機材名;
    e.appendChild(b);
    e.appendChild(document.createTextNode('　' + 結果));
  } else {
    e.appendChild(document.createTextNode(結果));
  }
  // ★ 読んだ文字は、原因を追うときに要ります。小さく後ろに残すこと（消さない）
  if (生) {
    var sm = document.createElement('small');
    sm.textContent = 生;
    e.appendChild(sm);
  }
  e.title = e.textContent;
}

function 知らせる(text, kind) {
  var t = $('toast');
  t.textContent = text;
  t.className = 'toast ' + (kind === 'ng' ? 'warn' : (kind || ''));
  t.style.display = 'block';
  clearTimeout(t.__timer);
  // ★★ NG は**長めに**出します。1.8秒だと、手元を見ているあいだに消えます
  t.__timer = setTimeout(function () { t.style.display = 'none'; },
                         (kind === 'ng') ? 4000 : 1800);
}

// ==========================================================
//  保存
// ==========================================================
//
// ★★ **途中でも保存できます。** 現場は待ってくれません。
//   足りないぶんは「未チェック」として残ります。
//   **黙って「全部そろった」ことにはしません。**
function 保存する() {
  if (!state.items.length) { 知らせる('保存するものがありません', 'warn'); return; }
  var 済 = state.items.filter(function (x) { return x.checked && !x.extra; }).length;
  var 未 = state.items.filter(function (x) { return !x.checked && !x.extra; }).length;
  var 種別 = (state.mode === 'return') ? '返却' : '持ち出し';

  if (!confirm(種別 + 'のチェックを記録します。\n\n' +
               '　チェック済　' + 済 + ' 件\n' +
               '　未チェック　' + 未 + ' 件\n\n' +
               (未 ? '未チェックのぶんは「未チェック」として残ります。\n\n' : '') +
               'よろしいですか？')) return;

  var 荷物 = {
    mode: state.mode,
    results: state.items.map(function (x) {
      return { eqId: x.eqId, checked: !!x.checked, extra: !!x.extra, how: x.how || '手' };
    })
  };
  送る(荷物);
}

// ==========================================================
//  オーダーシート（保存したあとに出す）
// ==========================================================
//
// ★★★ **PCで刷る紙と同じ中身**にします（2026-08-17 辻さんのご指示）。
//   左右の枠の決まりは管理画面の設定が持っているので、**サーバーで組み立てて**もらいます。
//   ここに決まりを書き写すと、PCの紙と現場の画面が**静かに食い違います。**
//   （印（H:）を写さないのと同じ考えです）
//
// ★★ スマホは横が狭いので、左右2列ではなく**上から順の1列**にします。

/**
 * ★★★★ 保存が通ったら、**その場で作り直します。**（2026-08-17）
 *   チェックの画面そのものがオーダーシートなので、別の画面へ移りません。
 *   サーバーから済み具合をもらい直して、印を確かなもの（＊なし）に置き換えます。
 */
/**
 * ★★★ いま何をしているかを見せる／しまう
 *
 *   現場では14台ぶんを送るのに何秒かかかります。
 *   その間に何も出ないと、**押せていないと思ってもう一度押されます。**
 */
function 待たせる_(文) {
  var e = $('busy');
  if (!e) return;
  $('busytext').textContent = 文;
  e.style.display = 'block';
}
function 待つのをやめる_() {
  var e = $('busy');
  if (e) e.style.display = 'none';
}

function 保存のあと作り直す_() {
  呼ぶ('order')
    .then(function (d) {
      待つのをやめる_();
      state.進み = d.progress || state.進み;
      state.枠 = d.sheet || state.枠;
      // ★ 保存が通ったので、いま付いているものは「保存済み」（＊を外す）
      state.items.forEach(function (x) { if (x.checked) x.保存済み = true; });
      描く();
      知らせる('オーダーシートを更新しました', 'ok');
    })
    .catch(function (e) {
      // ★★ 作り直せなくても、**保存はもう通っています。**そこを取り違えさせないこと
      待つのをやめる_();
      var 訳 = (e && e.message) || String(e);
      知らせる('保存はできました。表を作り直せません', 'warn');
      // ★★★★ **原因が「デプロイの更新忘れ」なら、そう言うこと。**
      //   生のエラーだけ出しても、何をすればいいのか分かりません。
      if (/知らない依頼/.test(訳)) {
        帯を出す_('⚠️ サーバーが古いままです。この版では表を作り直せません。\n' +
          'GASエディタ →［デプロイ］→［デプロイを管理］→ ' +
          '**2つめ（QRチェック用API）の ✏️** → バージョン「新バージョン」→［デプロイ］\n' +
          '※ 保存そのものは通っています。記録は残っています。');
      }
      読んだものを出す('', '保存はできました。表を作り直せません：' + 訳, 'warn', '');
    });
}

function 送る(荷物) {
  var b = $('saveBtn');
  b.disabled = true;
  b.textContent = '保存中…';
  待たせる_('記録しています… (' + (荷物.results || []).length + '件)');
  呼ぶ('save', 荷物)
    .then(function (d) {
      localStorage.removeItem(未送信の鍵);
      $('pending').style.display = 'none';
      // ★ 全件まとめて送ったので、同じモードの1点ぶんの控えは用済み
      未送信のtick_ = 未送信のtick_.filter(function (x) { return x.mode !== 荷物.mode; });
      tickを控える_();
      知らせる('記録しました（済' + d.checked + ' / 未' + d.missing + '）', 'ok');
      // ★★★ 保存できたら、そのままオーダーシートを出します（2026-08-17 辻さんのご指示）
      if (読み取り中) スキャンを止める();      // ★ 裏でカメラを回したままにしない
      待たせる_('オーダーシートを作り直しています…');
      保存のあと作り直す_();
    })
    .catch(function (e) {
      // ★★★ **落としたものを、なかったことにしない。**
      //   電波の悪い現場で押すことが前提です。端末に残して、次に押したときに送ります。
      待つのをやめる_();
      localStorage.setItem(未送信の鍵, JSON.stringify(荷物));
      $('pending').style.display = 'block';
      alert('記録を送れませんでした。\n' + ((e && e.message) || e) +
            '\n\nこの端末に残してあります。電波の届くところで、もう一度「保存」を押してください。');
    })
    .then(function () {
      // ★ しくじってもボタンは必ず戻すこと。押せないまま現場に残さない
      var b2 = $('saveBtn');
      b2.disabled = false;
      b2.textContent = '保存';
    });
}
</script>
